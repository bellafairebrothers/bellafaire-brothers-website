name: Build and deploy site

on:
  # Every edit (including Pages CMS saves) rebuilds the site.
  push:
    branches: [main]
  # Rebuild every 6 hours to pick up new Spotify releases, videos, shows and Instagram posts.
  schedule:
    - cron: '17 */6 * * *'
  # "Run workflow" button in the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the Photos page can sort photos by when they were added.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Convert iPhone HEIC photos to JPG
        continue-on-error: true
        run: |
          shopt -s nullglob nocaseglob
          files=(src/assets/photos/*.heic src/assets/uploads/*.heic)
          if [ ${#files[@]} -gt 0 ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq libheif-examples
            for f in "${files[@]}"; do heif-convert -q 90 "$f" "${f%.*}.jpg"; done
          fi
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          BANDSINTOWN_APP_ID: ${{ secrets.BANDSINTOWN_APP_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
